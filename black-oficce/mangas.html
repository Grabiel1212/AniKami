<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Office - Mangas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .portada-tabla {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }
        .estado-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
        }
        .autor-card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
        }
        .hover-card:hover {
            transform: translateY(-3px);
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2"><i class="bi bi-book me-2"></i>Lista de Mangas</h1>
            <div>
                <button class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Agregar Manga
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Buscar por título..." id="buscarTitulo">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filtroEstado">
                            <option value="">Todos los estados</option>
                            <option value="Publicando">Publicando</option>
                            <option value="Finalizado">Finalizado</option>
                            <option value="Pausado">Pausado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary w-100" onclick="filtrarMangas()">
                            <i class="bi bi-funnel me-1"></i>Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de Mangas -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Portada</th>
                                <th>Título</th>
                                <th>Estado</th>
                                <th>Capítulos</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMangas">
                            <!-- Los mangas se cargarán aquí -->
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <div class="spinner-border text-primary" id="loadingSpinner" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle Manga -->
    <div class="modal fade" id="modalDetalle" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4 text-center">
                            <img id="dPortada" class="img-fluid rounded mb-3" alt="Portada">
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" id="btnLeerManga">
                                    <i class="bi bi-book me-1"></i>Leer Manga
                                </button>
                                <button class="btn btn-outline-secondary">
                                    <i class="bi bi-bookmark me-1"></i>Guardar
                                </button>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="mb-3">
                                <span class="badge bg-success" id="dEstado"></span>
                                <span class="badge bg-info ms-2" id="dCapitulos"></span>
                            </div>
                            <h6>Descripción:</h6>
                            <p id="dDescripcion" class="text-muted"></p>
                            
                            <div class="card mt-4">
                                <div class="card-header bg-dark">
                                    <h6 class="mb-0"><i class="bi bi-person-badge me-1"></i>Autor</h6>
                                </div>
                                <div class="card-body">
                                    <div class="d-flex align-items-center">
                                        <img id="aFoto" class="rounded-circle me-3" width="60" height="60">
                                        <div>
                                            <h6 class="mb-1" id="aNombre"></h6>
                                            <p class="text-muted small mb-0" id="aDescripcion"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ===== LISTAR MANGAS =====
        let todosMangas = []; // Para filtrado
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        function cargarMangas() {
            loadingSpinner.style.display = 'block';
            
            fetch("http://localhost:8081/anikami/mangas/listar")
                .then(r => {
                    if (!r.ok) throw new Error('Error en la respuesta del servidor');
                    return r.json();
                })
                .then(res => {
                    loadingSpinner.style.display = 'none';
                    
                    if(res.success){
                        todosMangas = res.data;
                        mostrarMangas(todosMangas);
                    } else {
                        mostrarError('No se pudieron cargar los mangas');
                    }
                })
                .catch(error => {
                    loadingSpinner.style.display = 'none';
                    console.error('Error:', error);
                    mostrarError('Error al conectar con el servidor');
                });
        }

        function mostrarMangas(mangas) {
            const tbody = document.getElementById("tablaMangas");
            tbody.innerHTML = '';
            
            if (mangas.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-4">
                            <i class="bi bi-book display-1 text-muted mb-3"></i>
                            <h5>No se encontraron mangas</h5>
                        </td>
                    </tr>
                `;
                return;
            }
            
            mangas.forEach(m => {
                const estadoClass = m.estado === 'Publicando' ? 'bg-success' : 
                                  m.estado === 'Finalizado' ? 'bg-secondary' : 'bg-warning';
                
                tbody.innerHTML += `
                <tr class="hover-card">
                    <td>${m.id}</td>
                    <td><img class="portada-tabla" src="${m.portada_url || 'https://via.placeholder.com/60x80'}" alt="${m.titulo}"></td>
                    <td>
                        <strong>${m.titulo}</strong><br>
                        <small class="text-muted">${m.generos || ''}</small>
                    </td>
                    <td><span class="badge ${estadoClass} estado-badge">${m.estado}</span></td>
                    <td>${m.total_capitulos || '0'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-info me-1" onclick="verDetalle(${m.id})" title="Ver detalle">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-primary" onclick="leerManga(${m.id}, '${m.titulo}')" title="Leer manga">
                            <i class="bi bi-book"></i>
                        </button>
                    </td>
                </tr>
                `;
            });
        }

        // ===== FILTRAR MANGAS =====
        function filtrarMangas() {
            const filtroTitulo = document.getElementById('buscarTitulo').value.toLowerCase();
            const filtroEstado = document.getElementById('filtroEstado').value;
            
            let mangasFiltrados = todosMangas;
            
            if (filtroTitulo) {
                mangasFiltrados = mangasFiltrados.filter(m => 
                    m.titulo.toLowerCase().includes(filtroTitulo)
                );
            }
            
            if (filtroEstado) {
                mangasFiltrados = mangasFiltrados.filter(m => 
                    m.estado === filtroEstado
                );
            }
            
            mostrarMangas(mangasFiltrados);
        }

        // ===== VER DETALLE =====
        let mangaActualId = null;
        
        function verDetalle(id){
            mangaActualId = id;
            
            fetch("http://localhost:8081/anikami/mangas/detalle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mangaId: id })
            })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    const m = res.data;
                    
                    document.getElementById('dTitulo').textContent = m.titulo || 'Sin título';
                    document.getElementById('dDescripcion').textContent = m.descripcion || 'Sin descripción';
                    document.getElementById('dEstado').textContent = m.estado || 'Desconocido';
                    document.getElementById('dCapitulos').textContent = `${m.totalCapitulos || 0} capítulos`;
                    document.getElementById('dPortada').src = m.portada_url || m.portadaUrl || 'https://via.placeholder.com/300x400';
                    
                    document.getElementById('aNombre').textContent = m.autorNombre || 'Autor desconocido';
                    document.getElementById('aDescripcion').textContent = m.autorDescripcion || '';
                    document.getElementById('aFoto').src = m.autorFoto || 'https://via.placeholder.com/60';
                    
                    // Configurar botón de leer
                    document.getElementById('btnLeerManga').onclick = () => {
                        leerManga(id, m.titulo);
                    };
                    
                    // Mostrar modal
                    const modal = new bootstrap.Modal(document.getElementById('modalDetalle'));
                    modal.show();
                } else {
                    mostrarError('No se pudo cargar el detalle del manga');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                mostrarError('Error al cargar el detalle');
            });
        }

        // ===== LEER MANGA =====
        function leerManga(id, titulo) {
            // Cerrar modal si está abierto
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalDetalle'));
            if (modal) modal.hide();
            
            // Obtener el total de capítulos primero
            fetch("http://localhost:8081/anikami/mangas/detalle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mangaId: id })
            })
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    const m = res.data;
                    window.location.href = `leer_manga.html?mangaId=${id}&total=${m.totalCapitulos || 0}&titulo=${encodeURIComponent(titulo)}`;
                } else {
                    // Si falla, redirigir con valores por defecto
                    window.location.href = `leer_manga.html?mangaId=${id}&total=0&titulo=${encodeURIComponent(titulo)}`;
                }
            })
            .catch(() => {
                // Si hay error, redirigir igual
                window.location.href = `leer_manga.html?mangaId=${id}&total=0&titulo=${encodeURIComponent(titulo)}`;
            });
        }

        function mostrarError(mensaje) {
            const tbody = document.getElementById("tablaMangas");
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-triangle display-4 mb-3"></i>
                        <h5>${mensaje}</h5>
                        <button class="btn btn-primary mt-2" onclick="cargarMangas()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Reintentar
                        </button>
                    </td>
                </tr>
            `;
        }

        // Cargar mangas al iniciar
        document.addEventListener('DOMContentLoaded', cargarMangas);
    </script>
</body>
</html>
