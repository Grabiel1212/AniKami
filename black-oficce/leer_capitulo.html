<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura - Anikami</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bs-primary: #6f42c1;
            --bs-dark-bg: #121212;
        }
        body {
            background: var(--bs-dark-bg);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .reader-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .reader-nav.hidden {
            transform: translateY(-100%);
        }
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 40px;
        }
        .manga-page {
            max-width: 100%;
            width: auto;
            height: auto;
            margin: 0 auto 10px;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        .manga-page:hover {
            transform: scale(1.01);
        }
        .page-controls {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .page-controls:hover {
            opacity: 1;
        }
        .page-controls.right {
            left: auto;
            right: 20px;
        }
        .chapter-info-card {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(111, 66, 193, 0.3);
            z-index: 100;
            min-width: 300px;
        }
        .reading-progress {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.1);
        }
        .reading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--bs-primary), #9d4edd);
            transition: width 0.3s ease;
            width: 0%;
        }
        .page-thumbnail {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .page-thumbnail:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(111, 66, 193, 0.3);
        }
        .page-thumbnail.active {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 2px rgba(111, 66, 193, 0.5);
        }
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 10px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bs-dark-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .page-navigation-dots {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }
        .page-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .page-dot.active {
            background: var(--bs-primary);
            transform: scale(1.3);
        }
        .page-dot:hover {
            background: rgba(111, 66, 193, 0.7);
        }
        @media (max-width: 768px) {
            .page-controls, .page-controls.right {
                display: none;
            }
            .zoom-controls {
                bottom: 10px;
                right: 10px;
            }
            .chapter-info-card {
                width: 90%;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h4 id="loadingText">Cargando páginas...</h4>
            <p class="text-muted" id="loadingSubtext">Esto puede tomar unos segundos</p>
            <div class="mt-3">
                <button class="btn btn-outline-secondary btn-sm" onclick="cancelLoad()" id="cancelBtn">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-dark reader-nav" id="readerNav">
        <div class="container-fluid">
            <div class="d-flex w-100 align-items-center">
                <button class="btn btn-outline-light btn-sm" onclick="goBack()">
                    <i class="bi bi-arrow-left"></i>
                </button>
                
                <div class="mx-3 flex-grow-1">
                    <div class="d-flex align-items-center">
                        <h6 class="mb-0 text-truncate me-3" id="chapterTitle">Capítulo</h6>
                        <span class="badge bg-primary" id="pageCounter">1/1</span>
                    </div>
                    <div class="d-flex align-items-center mt-1">
                        <small class="text-muted" id="mangaTitleNav"></small>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-outline-light btn-sm" id="prevPageBtn" title="Página anterior (←)">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="btn btn-outline-light btn-sm" id="nextPageBtn" title="Página siguiente (→)">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                    <button class="btn btn-outline-light btn-sm" onclick="toggleFullscreen()" title="Pantalla completa (F)">
                        <i class="bi bi-fullscreen"></i>
                    </button>
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Ajustes">
                        <i class="bi bi-gear"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="reading-progress">
        <div class="reading-progress-bar" id="readingProgress"></div>
    </div>

    <!-- Page Controls (Left) -->
    <div class="page-controls d-none d-md-block">
        <div class="btn-group-vertical">
            <button class="btn btn-dark border-secondary" onclick="firstPage()" title="Primera página">
                <i class="bi bi-skip-backward"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="prevPage()" title="Página anterior">
                <i class="bi bi-chevron-up"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="nextPage()" title="Página siguiente">
                <i class="bi bi-chevron-down"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="lastPage()" title="Última página">
                <i class="bi bi-skip-forward"></i>
            </button>
        </div>
    </div>

    <!-- Page Controls (Right) -->
    <div class="page-controls right d-none d-md-block">
        <div class="btn-group-vertical">
            <button class="btn btn-dark border-secondary" onclick="toggleReadingMode()" title="Modo lectura (R)">
                <i class="bi bi-moon" id="readingModeIcon"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="toggleNav()" title="Mostrar/ocultar controles (H)">
                <i class="bi bi-eye-slash" id="navToggleIcon"></i>
            </button>
            <button class="btn btn-dark border-secondary" data-bs-toggle="modal" data-bs-target="#pagesModal" title="Miniaturas (G)">
                <i class="bi bi-grid-3x3-gap"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="markChapterAsRead()" title="Marcar como leído (M)">
                <i class="bi bi-check-circle"></i>
            </button>
        </div>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
        <div class="btn-group">
            <button class="btn btn-dark border-secondary" onclick="zoomOut()" title="Alejar (-)">
                <i class="bi bi-dash-lg"></i>
            </button>
            <button class="btn btn-dark border-secondary" onclick="resetZoom()" title="Zoom normal (0)">
                100%
            </button>
            <button class="btn btn-dark border-secondary" onclick="zoomIn()" title="Acercar (+)">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>

    <!-- Pages Container -->
    <div class="page-container" id="pagesContainer">
        <!-- Las páginas se cargarán aquí dinámicamente -->
    </div>

    <!-- Page Navigation Dots -->
    <div class="page-navigation-dots d-none d-md-block" id="pageDots">
        <!-- Los puntos de navegación se generarán aquí -->
    </div>

    <!-- Chapter Info Card -->
    <div class="chapter-info-card rounded-3 p-3 d-none d-md-block" id="chapterInfoCard">
        <div class="d-flex align-items-center">
            <img id="mangaThumb" class="rounded me-3" width="40" height="60" style="object-fit: cover;">
            <div class="flex-grow-1">
                <h6 class="mb-0 text-truncate" id="mangaName"></h6>
                <small class="text-muted" id="chapterInfo"></small>
            </div>
            <button class="btn btn-sm btn-outline-primary ms-2" onclick="markChapterAsRead()">
                <i class="bi bi-check-circle me-1"></i>Leído
            </button>
        </div>
    </div>

    <!-- Pages Modal (Thumbnail View) -->
    <div class="modal fade" id="pagesModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-fullscreen-md-down">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-grid-3x3-gap me-2"></i>Miniaturas de páginas
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2" id="pagesThumbnails"></div>
                </div>
                <div class="modal-footer">
                    <small class="text-muted">Haz clic en una miniatura para ir a esa página</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-gear me-2"></i>Ajustes de lectura
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Modo de lectura</label>
                        <select class="form-select" id="readingModeSelect">
                            <option value="default">Por página</option>
                            <option value="scroll">Scroll continuo</option>
                            <option value="webtoon">Estilo Webtoon</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Calidad de imagen</label>
                        <select class="form-select" id="qualitySelect">
                            <option value="auto">Automática</option>
                            <option value="high">Alta</option>
                            <option value="medium">Media</option>
                            <option value="low">Baja</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ancho de página</label>
                        <select class="form-select" id="widthSelect">
                            <option value="auto">Automático</option>
                            <option value="full">Pantalla completa</option>
                            <option value="original">Tamaño original</option>
                        </select>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="autoHideNav" checked>
                        <label class="form-check-label" for="autoHideNav">Ocultar controles automáticamente</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="preloadImages" checked>
                        <label class="form-check-label" for="preloadImages">Precargar imágenes</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" data-bs-dismiss="modal">Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG = {
            LOAD_TIMEOUT: 10000, // 10 segundos máximo de carga
            DEMO_MODE: true,     // Activar modo demostración si falla el endpoint
            PRELOAD_NEXT_PAGES: 2,
            AUTO_HIDE_NAV_DELAY: 3000
        };

        // ===== VARIABLES GLOBALES =====
        const params = new URLSearchParams(window.location.search);
        const capituloId = parseInt(params.get("capituloId"));
        const mangaId = parseInt(params.get("mangaId")) || 1;
        const chapterNumber = parseInt(params.get("chapterNumber")) || 1;

        let pages = [];
        let currentPage = 0;
        let zoomLevel = 1;
        let navVisible = true;
        let isFullscreen = false;
        let autoHideNavTimeout;
        let loadTimeout;
        let isLoading = true;
        let mangaInfo = {};

        // Validar parámetros
        if (!capituloId) {
            alert("Error: No se recibió el ID del capítulo");
            window.location.href = "leer_manga.html";
        }

        // ===== FUNCIONES DE INICIALIZACIÓN =====
        async function initializeReader() {
            updateLoadingText("Inicializando lector...");
            
            // Cargar información del manga
            await loadMangaInfo();
            
            // Cargar páginas con timeout
            await loadPagesWithTimeout();
            
            // Configurar interfaz
            setupUI();
            
            // Configurar event listeners
            setupEventListeners();
            
            // Ocultar loading
            hideLoading();
        }

        function updateLoadingText(text) {
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.textContent = text;
        }

        // ===== CARGAR PÁGINAS CON TIMEOUT =====
        async function loadPagesWithTimeout() {
            return new Promise((resolve) => {
                // Configurar timeout
                loadTimeout = setTimeout(() => {
                    if (isLoading) {
                        console.warn("Timeout: Usando modo demostración");
                        generateDemoPages();
                        resolve();
                    }
                }, CONFIG.LOAD_TIMEOUT);
                
                // Intentar cargar del endpoint
                loadPagesFromAPI().then(resolve).catch(() => {
                    if (CONFIG.DEMO_MODE) {
                        generateDemoPages();
                        resolve();
                    }
                });
            });
        }

        function cancelLoad() {
            if (CONFIG.DEMO_MODE) {
                generateDemoPages();
                setupUI();
                hideLoading();
            }
        }

        // ===== CARGAR PÁGINAS DESDE API =====
        async function loadPagesFromAPI() {
            updateLoadingText("Cargando páginas desde el servidor...");
            
            try {
                const response = await fetch("http://localhost:8081/anikami/mangas/paginas/por-capitulo", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ capituloId: capituloId })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    pages = data.data.sort((a, b) => a.numeroPagina - b.numeroPagina);
                    console.log(`Cargadas ${pages.length} páginas del servidor`);
                } else {
                    throw new Error("No hay datos de páginas");
                }
                
            } catch (error) {
                console.error("Error cargando páginas:", error);
                throw error;
            }
        }

        // ===== GENERAR PÁGINAS DE DEMOSTRACIÓN =====
        function generateDemoPages() {
            updateLoadingText("Generando páginas de demostración...");
            
            // Generar 15 páginas de demostración
            pages = [];
            const totalDemoPages = 15;
            
            for (let i = 1; i <= totalDemoPages; i++) {
                pages.push({
                    id: i,
                    numeroPagina: i,
                    imagenUrl: `https://picsum.photos/800/1200?random=${i}&grayscale`,
                    capituloNumero: chapterNumber,
                    titulo: `Página ${i}`,
                    descripcion: `Esta es la página ${i} del capítulo ${chapterNumber}`
                });
            }
            
            console.log(`Generadas ${pages.length} páginas de demostración`);
        }

        // ===== CARGAR INFORMACIÓN DEL MANGA =====
        async function loadMangaInfo() {
            try {
                const response = await fetch("http://localhost:8081/anikami/mangas/detalle", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mangaId: mangaId })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        mangaInfo = data.data;
                    }
                }
            } catch (error) {
                console.warn("No se pudo cargar la información del manga, usando valores por defecto");
                mangaInfo = {
                    titulo: `Manga #${mangaId}`,
                    estado: "Publicando",
                    portadaUrl: "https://via.placeholder.com/200x300/6f42c1/ffffff?text=Manga"
                };
            }
        }

        // ===== CONFIGURAR INTERFAZ =====
        function setupUI() {
            // Actualizar información del manga
            document.getElementById('mangaTitleNav').textContent = mangaInfo.titulo || `Manga #${mangaId}`;
            document.getElementById('mangaName').textContent = mangaInfo.titulo || `Manga #${mangaId}`;
            document.getElementById('chapterInfo').textContent = `Capítulo ${chapterNumber} • ${mangaInfo.estado || 'Estado desconocido'}`;
            document.getElementById('mangaThumb').src = mangaInfo.portadaUrl || 'https://via.placeholder.com/40x60';
            
            // Mostrar páginas
            displayPages();
            
            // Actualizar información de página
            updatePageInfo();
            
            // Mostrar controles
            showControls();
            
            // Scroll a la primera página
            setTimeout(() => scrollToPage(0), 100);
        }

        function displayPages() {
            const container = document.getElementById('pagesContainer');
            container.innerHTML = '';
            
            pages.forEach((page, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-wrapper mb-4';
                pageDiv.id = `page-${index}`;
                pageDiv.style.maxWidth = '1000px';
                pageDiv.style.width = '100%';
                
                pageDiv.innerHTML = `
                    <img src="${page.imagenUrl}" 
                         class="manga-page" 
                         alt="Página ${page.numeroPagina}"
                         data-page="${index}"
                         loading="${index < 3 ? 'eager' : 'lazy'}"
                         onload="this.style.opacity='1'"
                         onerror="this.src='https://via.placeholder.com/800/333333/ffffff?text=Error+Cargando+Página+${page.numeroPagina}'"
                         style="opacity:0; transition: opacity 0.3s ease;">
                    <div class="text-center mt-2">
                        <small class="text-muted">Página ${page.numeroPagina}</small>
                    </div>
                `;
                
                container.appendChild(pageDiv);
            });
            
            // Crear miniaturas
            createThumbnails();
            
            // Crear puntos de navegación
            createPageDots();
        }

        function createThumbnails() {
            const container = document.getElementById('pagesThumbnails');
            container.innerHTML = '';
            
            pages.forEach((page, index) => {
                const col = document.createElement('div');
                col.className = 'col-6 col-sm-4 col-md-3 col-lg-2';
                col.innerHTML = `
                    <div class="position-relative">
                        <img src="${page.imagenUrl}" 
                             class="page-thumbnail w-100"
                             onclick="jumpToPage(${index})"
                             alt="Página ${page.numeroPagina}"
                             loading="lazy">
                        <div class="position-absolute bottom-0 end-0 bg-dark px-1 rounded-start">
                            <small>${page.numeroPagina}</small>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function createPageDots() {
            const container = document.getElementById('pageDots');
            if (!container) return;
            
            container.innerHTML = '';
            
            // Mostrar máximo 20 puntos
            const dotCount = Math.min(pages.length, 20);
            const step = Math.max(1, Math.floor(pages.length / dotCount));
            
            for (let i = 0; i < pages.length; i += step) {
                const dot = document.createElement('div');
                dot.className = 'page-dot';
                dot.title = `Página ${i + 1}`;
                dot.onclick = () => jumpToPage(i);
                container.appendChild(dot);
            }
            
            updatePageDots();
        }

        // ===== NAVEGACIÓN =====
        function jumpToPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= pages.length) return;
            
            currentPage = pageIndex;
            const pageElement = document.getElementById(`page-${pageIndex}`);
            if (pageElement) {
                pageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                updatePageInfo();
                updatePageDots();
                updateThumbnailSelection();
                resetAutoHideNav();
            }
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                jumpToPage(currentPage + 1);
            } else {
                // Capítulo siguiente
                showNotification("¡Has terminado este capítulo!", "success");
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                jumpToPage(currentPage - 1);
            } else {
                // Capítulo anterior
                showNotification("Este es el inicio del capítulo", "info");
            }
        }

        function firstPage() {
            jumpToPage(0);
        }

        function lastPage() {
            jumpToPage(pages.length - 1);
        }

        // ===== ACTUALIZAR INTERFAZ =====
        function updatePageInfo() {
            document.getElementById('pageCounter').textContent = `${currentPage + 1}/${pages.length}`;
            document.getElementById('chapterTitle').textContent = `Capítulo ${chapterNumber} - Página ${currentPage + 1}`;
            
            const progress = ((currentPage + 1) / pages.length * 100).toFixed(1);
            document.getElementById('readingProgress').style.width = `${progress}%`;
        }

        function updatePageDots() {
            const dots = document.querySelectorAll('.page-dot');
            if (!dots.length) return;
            
            const activeIndex = Math.floor((currentPage / pages.length) * dots.length);
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === activeIndex);
            });
        }

        function updateThumbnailSelection() {
            document.querySelectorAll('.page-thumbnail').forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentPage);
            });
        }

        // ===== CONTROLES =====
        function showControls() {
            document.getElementById('readerNav').style.display = 'flex';
            document.querySelectorAll('.page-controls').forEach(el => el.style.display = 'block');
            document.querySelector('.zoom-controls').style.display = 'block';
            document.getElementById('chapterInfoCard').style.display = 'block';
            document.getElementById('pageDots').style.display = 'flex';
        }

        function toggleNav() {
            navVisible = !navVisible;
            const nav = document.getElementById('readerNav');
            nav.classList.toggle('hidden', !navVisible);
            
            const icon = document.getElementById('navToggleIcon');
            icon.classList.toggle('bi-eye-slash', !navVisible);
            icon.classList.toggle('bi-eye', navVisible);
            
            if (navVisible) {
                resetAutoHideNav();
            }
        }

        function resetAutoHideNav() {
            if (!document.getElementById('autoHideNav')?.checked) return;
            
            clearTimeout(autoHideNavTimeout);
            if (navVisible) {
                autoHideNavTimeout = setTimeout(() => {
                    toggleNav();
                }, CONFIG.AUTO_HIDE_NAV_DELAY);
            }
        }

        // ===== ZOOM =====
        function zoomIn() {
            if (zoomLevel < 3) {
                zoomLevel += 0.1;
                applyZoom();
            }
        }

        function zoomOut() {
            if (zoomLevel > 0.3) {
                zoomLevel -= 0.1;
                applyZoom();
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            applyZoom();
        }

        function applyZoom() {
            const pages = document.querySelectorAll('.manga-page');
            pages.forEach(img => {
                img.style.transform = `scale(${zoomLevel})`;
            });
            
            // Actualizar texto del botón de zoom
            const zoomBtn = document.querySelector('.zoom-controls .btn:nth-child(2)');
            if (zoomBtn) {
                zoomBtn.textContent = `${Math.round(zoomLevel * 100)}%`;
            }
        }

        // ===== PANTALLA COMPLETA =====
        function toggleFullscreen() {
            const elem = document.documentElement;
            
            if (!isFullscreen) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
            
            isFullscreen = !isFullscreen;
        }

        // ===== MODO LECTURA =====
        function toggleReadingMode() {
            const body = document.body;
            const isDark = body.getAttribute('data-bs-theme') === 'dark';
            
            body.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
            document.body.style.background = isDark ? '#f8f9fa' : '#121212';
            
            const icon = document.getElementById('readingModeIcon');
            icon.classList.toggle('bi-moon', isDark);
            icon.classList.toggle('bi-sun', !isDark);
        }

        // ===== UTILIDADES =====
        function hideLoading() {
            isLoading = false;
            clearTimeout(loadTimeout);
            document.getElementById('loadingOverlay').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
            }, 300);
        }

        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `position-fixed top-0 end-0 m-3 toast show`;
            toast.innerHTML = `
                <div class="toast-header bg-${type} text-white">
                    <i class="bi bi-${type === 'success' ? 'check-circle' : 'info-circle'} me-2"></i>
                    <strong class="me-auto">${type === 'success' ? 'Éxito' : 'Información'}</strong>
                    <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.remove()"></button>
                </div>
                <div class="toast-body">
                    ${message}
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function markChapterAsRead() {
            // Guardar en localStorage
            const readChapters = JSON.parse(localStorage.getItem('readChapters') || '{}');
            if (!readChapters[mangaId]) readChapters[mangaId] = [];
            if (!readChapters[mangaId].includes(chapterNumber)) {
                readChapters[mangaId].push(chapterNumber);
                localStorage.setItem('readChapters', JSON.stringify(readChapters));
            }
            
            showNotification("Capítulo marcado como leído", "success");
        }

        function goBack() {
            window.history.back();
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Navegación con teclado
            document.addEventListener('keydown', (e) => {
                // Ignorar si el usuario está escribiendo en un input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key) {
                    case 'ArrowRight':
                    case ' ':
                    case 'd':
                        e.preventDefault();
                        nextPage();
                        break;
                    case 'ArrowLeft':
                    case 'a':
                        e.preventDefault();
                        prevPage();
                        break;
                    case 'Home':
                        firstPage();
                        break;
                    case 'End':
                        lastPage();
                        break;
                    case 'Escape':
                        resetZoom();
                        break;
                    case 'f':
                        toggleFullscreen();
                        break;
                    case 'r':
                        toggleReadingMode();
                        break;
                    case 'h':
                        toggleNav();
                        break;
                    case 'm':
                        markChapterAsRead();
                        break;
                    case 'g':
                        new bootstrap.Modal(document.getElementById('pagesModal')).show();
                        break;
                    case '+':
                    case '=':
                        zoomIn();
                        break;
                    case '-':
                    case '_':
                        zoomOut();
                        break;
                    case '0':
                        resetZoom();
                        break;
                }
            });

            // Detectar scroll para actualizar página actual
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    // Encontrar la página más cercana al centro
                    const pageElements = document.querySelectorAll('.page-wrapper');
                    let closestPage = 0;
                    let closestDistance = Infinity;
                    
                    pageElements.forEach((page, index) => {
                        const rect = page.getBoundingClientRect();
                        const distance = Math.abs(rect.top + rect.height/2 - window.innerHeight/2);
                        
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestPage = index;
                        }
                    });
                    
                    if (closestPage !== currentPage) {
                        currentPage = closestPage;
                        updatePageInfo();
                        updatePageDots();
                        updateThumbnailSelection();
                    }
                }, 100);
                
                // Auto-hide nav al hacer scroll
                if (navVisible && document.getElementById('autoHideNav')?.checked) {
                    resetAutoHideNav();
                }
            });

            // Swipe en móviles
            let touchStartX = 0;
            let touchStartY = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            
            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;
                
                // Solo procesar si es un swipe horizontal (no vertical)
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextPage(); // Swipe izquierda -> siguiente
                    } else {
                        prevPage(); // Swipe derecha -> anterior
                    }
                }
            }, { passive: true });

            // Botones de navegación
            document.getElementById('prevPageBtn').onclick = prevPage;
            document.getElementById('nextPageBtn').onclick = nextPage;
            
            // Cambio de pantalla completa
            document.addEventListener('fullscreenchange', () => {
                isFullscreen = !!document.fullscreenElement;
            });
        }

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', () => {
            initializeReader();
        });

        // Forzar carga si hay algún problema
        setTimeout(() => {
            if (isLoading) {
                console.warn("Forzando carga después de 15 segundos");
                if (CONFIG.DEMO_MODE) {
                    generateDemoPages();
                    setupUI();
                    hideLoading();
                }
            }
        }, 15000);
    </script>
</body>
</html>
